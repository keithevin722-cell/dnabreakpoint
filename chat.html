<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1">
<title>Chat - DNA Breakpoint</title>
<style>
:root{--bg:#f4f7fa;--card:#fff;--text:#1b2733;--muted:#5b6b7b;--line:#d9e1e8;--accent:#0f9d8a;--accent2:#2a6fdb;--accent-ink:#fff;--code:#eaf1f6}
*{box-sizing:border-box}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.55;background:var(--bg);color:var(--text);max-width:720px;margin:0 auto;padding:0 1.2em 3em}
a{color:var(--accent2)}
small{color:var(--muted)}
.site-nav{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:1rem;margin:0 -1.2em;padding:.55em 1.2em;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(12px)}
.nav-brand{color:var(--text);font-weight:750;text-decoration:none}
h1{font-size:1.8rem;margin:1.2em 0 .3em;letter-spacing:-.02em}
p em{display:block;border-left:4px solid var(--accent);background:var(--card);padding:.6em .9em;border-radius:0 6px 6px 0;color:var(--muted);font-style:normal;font-size:.9rem}
#log{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:.5em 1em;height:55vh;overflow-y:auto;margin:1em 0}
.m{padding:.6em 0;border-bottom:1px solid var(--line)}
.m:last-child{border-bottom:0}
.m b{color:var(--accent)}
.m time{font-size:.75rem;color:var(--muted);margin-left:.4em}
.m p{margin:.2em 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.message-actions{display:flex;gap:.6em;margin-top:.35em}
.message-actions button{padding:.15em .5em;background:transparent;color:var(--accent2);border-color:var(--line);font-size:.8rem}
label{display:block;font-size:.85rem;color:var(--muted);margin-top:.6em}
input,textarea{width:100%;font:inherit;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:.55em .7em}
textarea{height:6em;resize:vertical}
input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;align-items:center;gap:.8em;margin-top:.7em}
button{font:inherit;font-weight:600;cursor:pointer;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:.5em 1.2em}
button:disabled{opacity:.6;cursor:wait}
#err{color:#c0392b}
.sr{position:absolute;left:-9999px}
.account{display:flex;align-items:center;gap:.8em;color:var(--muted);font-size:.9rem}
#logout{background:transparent;color:var(--text);border-color:var(--line);padding:.35em .8em}
</style>
<nav class=site-nav aria-label="Main navigation">
<a class=nav-brand href="index.html">DNA Breakpoint</a>
<a href="index.html">Back to tool</a>
</nav>
<h1>Community chat</h1>
<p><em>Messages are visible to users signed in with Google. Do not post genetic data, sequences or personal health information. The site owner can remove messages.</em></p>
<p id=off hidden>Chat is not enabled yet.</p>
<section id=authbox hidden>
<p>Sign in with Google to join the chat.</p>
<button type=button id=google>Sign in with Google</button>
<p id=autherr role=alert></p>
</section>
<section id=chat hidden>
<p class=account><span>Signed in as <strong id=google-name></strong></span><button type=button id=logout>Sign out</button></p>
<div id=log role=log aria-live=polite aria-label="Chat messages"></div>
<form id=cf>
<label for=nm>Name shown in chat (optional)</label>
<input id=nm maxlength=40 placeholder="Google display name" autocomplete=nickname>
<label for=msg>Message</label>
<textarea id=msg maxlength=500 required placeholder="Write a message (Ctrl+Enter to send)"></textarea>
<div class=row><button id=send>Send</button><button type=button id=cancel-edit hidden>Cancel edit</button><small id=count>0/500</small><small id=err role=alert></small></div>
</form>
</section>
<script src="config.js"></script>
<script type=module>
const $=id=>document.getElementById(id);
const CDN="https://www.gstatic.com/firebasejs/12.19.0/firebase-";
if(!FIREBASE.apiKey||!FIREBASE.appId)$("off").hidden=false;
else try{
 const[{initializeApp},authSdk,fs]=await Promise.all([import(CDN+"app.js"),import(CDN+"auth.js"),import(CDN+"firestore.js")]);
 const{getAuth,GoogleAuthProvider,signInWithPopup,signOut,onAuthStateChanged}=authSdk;
 const{getFirestore,collection,query,orderBy,limit,onSnapshot,writeBatch,doc,serverTimestamp}=fs;
 const app=initializeApp(FIREBASE),db=getFirestore(app),auth=getAuth(app);
 const provider=new GoogleAuthProvider();provider.setCustomParameters({prompt:"select_account"});
 const isAdmin=user=>!!FIREBASE.adminEmail&&!!user?.emailVerified&&user.email.toLowerCase()===FIREBASE.adminEmail.trim().toLowerCase();
 const{updateDoc,deleteDoc}=fs;
 let currentUser=null,editingId=null,stopMessages,first=true;
 const log=$("log");
 const draw=rows=>{const near=first||log.scrollHeight-log.scrollTop-log.clientHeight<80;first=false;
  if(!rows.length){const p=document.createElement("p");p.textContent="No messages yet. Say hello!";log.replaceChildren(p);return}
  log.replaceChildren(...rows.map(r=>{const d=document.createElement("div");d.className="m";
   const h=document.createElement("div"),b=document.createElement("b"),t=document.createElement("time");
   b.textContent=r.name;t.dateTime=r.at.toISOString();t.textContent=r.at.toLocaleString();h.append(b,t);
   const p=document.createElement("p");p.textContent=r.body;d.append(h,p);
  const own=currentUser?.uid===r.uid,admin=isAdmin(currentUser);
  if(own||admin){const actions=document.createElement("div");actions.className="message-actions";
   if(own){const edit=document.createElement("button");edit.type="button";edit.textContent="Edit";edit.setAttribute("aria-label","Edit your comment");
    edit.onclick=()=>{editingId=r.id;$("nm").value=r.name;$("msg").value=r.body;count();$("send").textContent="Save edit";$("cancel-edit").hidden=false;$("msg").focus()};
    actions.append(edit)}
   const remove=document.createElement("button");remove.type="button";remove.textContent=own?"Delete":"Admin delete";remove.setAttribute("aria-label",own?"Delete your comment":"Admin delete comment");
   remove.onclick=async()=>{if(!confirm(own?"Delete your comment?":"Delete this comment as administrator?"))return;remove.disabled=true;
     try{await deleteDoc(doc(db,"messages",r.id));if(editingId===r.id)resetEditor()}
    catch(error){$("err").textContent=error.code==="permission-denied"?"Firebase denied deletion. Check that the admin email matches the published rules.":"Could not delete comment.";remove.disabled=false}};
   actions.append(remove);d.append(actions)}
   return d}));
  if(near)log.scrollTop=log.scrollHeight};
 const resetEditor=()=>{editingId=null;$("cf").reset();$("send").textContent="Send";$("cancel-edit").hidden=true;count()};
 onAuthStateChanged(auth,user=>{
  currentUser=user;
  if(user&&!user.providerData.some(p=>p.providerId==="google.com")){signOut(auth);return}
  $("authbox").hidden=!!user;$("chat").hidden=!user;
  if(stopMessages){stopMessages();stopMessages=null}
  if(!user)return;
  $("google-name").textContent=user.displayName||"Google account";
  $("nm").value=localStorage.getItem("chatName")||user.displayName||"";
  stopMessages=onSnapshot(query(collection(db,"messages"),orderBy("createdAt","desc"),limit(50)),
  snap=>draw(snap.docs.map(d=>{const x=d.data({serverTimestamps:"estimate"});return{id:d.id,uid:x.uid,name:x.name,body:x.body,at:x.createdAt.toDate()}}).reverse()),
   ()=>{$("err").textContent="Could not load messages."});
 });
 $("google").onclick=async()=>{$("google").disabled=true;$("autherr").textContent="";
  try{await signInWithPopup(auth,provider)}catch(e){
   $("autherr").textContent=e.code==="auth/unauthorized-domain"
    ?"Add this site to Firebase Authentication's authorized domains."
    :e.code==="auth/operation-not-allowed"
     ?"Enable Google sign-in in Firebase Authentication settings."
     :"Google sign-in didn't finish. Please try again."}
  $("google").disabled=false};
 $("logout").onclick=()=>signOut(auth);
 const count=()=>{$("count").textContent=`${$("msg").value.length}/500`};
 $("msg").oninput=count;
 $("msg").onkeydown=e=>{if(e.key==="Enter"&&(e.ctrlKey||e.metaKey)){e.preventDefault();$("cf").requestSubmit()}};
 $("cancel-edit").onclick=resetEditor;
 $("cf").onsubmit=async e=>{e.preventDefault();const body=$("msg").value.trim();if(!body)return;
  const typed=$("nm").value.trim();localStorage.setItem("chatName",typed);
  $("send").disabled=true;$("err").textContent="";
  if(!currentUser){$("err").textContent="Sign in with Google before posting.";$("send").disabled=false;return}
  try{if(editingId){await updateDoc(doc(db,"messages",editingId),{name:typed||currentUser.displayName||"Anonymous",body})}
   else{const batch=writeBatch(db);
    batch.set(doc(db,"lastPost",currentUser.uid),{t:serverTimestamp()});
    batch.set(doc(collection(db,"messages")),{name:typed||currentUser.displayName||"Anonymous",body,createdAt:serverTimestamp(),uid:currentUser.uid});
    await batch.commit()}
   resetEditor()}
  catch(error){console.error("Chat message failed",error);$("err").textContent=error.code==="permission-denied"
   ?"Firebase blocked this change. Make sure the latest Firestore rules are published."
   :"Message not sent. Check your connection and try again."}
  $("send").disabled=false};
}catch{$("off").textContent="Chat could not load. Please try again later.";$("off").hidden=false}
</script>
